  cves:
  - CVE-2026-110678
  description: Cpanel::JSON::XS versions before 4.80 for Perl allow memory exhaustion
    by buffering incremental input past max_size in incr_parse.  The parser appends
    each chunk to its buffer. In scalar or list context, it compares max_size with
    how far it has progressed, not with the buffer length. A chunk that starts with
    a NUL byte stops the parser before it progresses, and a call in void context skips
    the check, so the buffer grows without limit.  A peer streaming data to an incr_parse
    consumer can exhaust process memory regardless of max_size.
  fixed_versions:
  - '>=1.08'
  github_security_advisory:
