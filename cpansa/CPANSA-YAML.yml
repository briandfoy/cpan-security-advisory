- affected_versions:
  - <1.30
  cves:
  - CVE-2017-20285
  description: |-
    YAML versions before 1.30 for Perl allow a loaded document to trigger the DESTROY method of arbitrary classes.

    A perl/hash:Class tag blesses a hash into the class it names. The document supplies the object's fields, and Perl calls DESTROY when it goes out of scope.

    What DESTROY does depends on the classes the process has loaded. With File::Temp::Dir from core Perl, it can delete a directory tree the document names.
