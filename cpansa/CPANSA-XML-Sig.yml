  - CVE-2025-40934
  description: XML-Sig versions 0.27 through 0.67 for Perl incorrectly validates XML
    files if signatures are omitted.  An attacker can remove the signature from the
    XML document to make it pass the verification check.  XML-Sig is a Perl module
    to validate signatures on XML files.  An unsigned XML file should return an error
    message.  The affected versions return true when attempting to validate an XML
    file that contains no signatures.
